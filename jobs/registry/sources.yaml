  # --- Public transport: PTV GTFS (decision 2026-07-25) -----------------
  # The council-only transport datasets below are DEFERRED: tram_tracks
  # has geometry but no stops, city_circle_* covers only the free tourist
  # loop, bus_stops covers a minor mode — while trains and regular tram
  # stops (the modes that define CBD access) appear in none of them.
  # PTV GTFS covers all stops, routes and scheduled frequencies statewide.

  - id: ptv_gtfs
    remote_dataset_id: ptv-gtfs-schedule
    title: PTV GTFS Schedule (Transport Victoria)
    capability: Transport access — all train/tram/bus stops, routes and
      scheduled departures by daypart; replaces council-only proxies
    fetch_mode: http_file
    download_url: https://data.ptv.vic.gov.au/downloads/gtfs.zip
    provider: transport_victoria
    attribution: "Public Transport Victoria (Department of Transport and Planning)"
    export_format: zip
    expected_cadence: weekly_check
    primary_keys: null   # GTFS is a multi-table standard; keys per inner table
    geometry: mixed      # stops are points; shapes are polylines
    licence: CC BY 4.0   # per Transport Victoria open-data terms — verify on
                         # the data.vic listing before beta attribution ships
    status: active
    freshness:
      strategy: http_header   # Last-Modified on the zip (2026-07-23 at adoption)
    records_count_at_validation: null   # 286 MB zip verified live 2026-07-25
    fields_observed: null   # standard GTFS files: stops.txt, routes.txt,
                            # trips.txt, stop_times.txt, calendar.txt, ...
    notes: >
      NESTED zip: top level contains numbered mode folders (2 = metro
      train, 3 = metro tram, 4 = metro bus, ...), each holding its own
      google_transit.zip — the transform stage must unpack two levels.
      Statewide coverage: filter stops to the municipal boundary plus a
      ~1 km buffer before loading core.transport_stop. stop_times.txt is
      large — stream it, never read whole into memory. Timezone in
      agency.txt is Australia/Melbourne (local, unlike transport_activity
      which is UTC). Service frequency by daypart comes from
      stop_times x calendar, giving the access score real departures
      rather than stop proximity alone.

