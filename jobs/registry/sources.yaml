# RetailScout source registry — City of Melbourne Open Data.
#
# This file is the single source of truth for what we ingest and how.
# Loaded and validated by retailscout_jobs.registry. Schema of each entry
# is the SourceDefinition model in retailscout_jobs/registry.py.
#
# Facts below were validated against the live Explore v2.1 API on
# 2026-07-25 (see context/progress-tracker.md "Data validation findings").
# fields_observed lists the field names THE API ACTUALLY RETURNS — use
# these when writing staging loaders, not the names in the architecture
# doc (several differ, e.g. hourly counts use location_id/hourday, not
# sensor_id/hour).
#
# fetch_mode:
#   export  — bulk download via /exports/{format}. REQUIRED for anything
#             over ~10k rows: /records caps at limit=100, offset<10000.
#   records — paginated /records queries; only for small tables or
#             incremental/metadata checks.
#
# status:
#   active      — validated, has data, ingest it
#   blocked     — exists but unusable today; do NOT build features on it
#   unvalidated — id resolved but metadata/fields not yet profiled

version: 1
provider_defaults:
  provider: city_of_melbourne
  base_url: https://data.melbourne.vic.gov.au/api/explore/v2.1
  attribution: "City of Melbourne Open Data"
  timezone: Australia/Melbourne

sources:
  - id: pedestrian_hourly
    remote_dataset_id: pedestrian-counting-system-monthly-counts-per-hour
    title: Pedestrian Counting System (counts per hour)
    capability: Daypart demand, weekday/weekend pattern, seasonality, trend
    fetch_mode: export
    export_format: csv
    expected_cadence: daily
    primary_keys: [location_id, sensing_date, hourday]
    geometry: point
    licence: UNVERIFIED   # API returns license: null — every sibling dataset is CC BY.
                          # BLOCKER for public attribution: confirm on portal before beta.
    status: active
    freshness:
      strategy: max_field
      field: sensing_date  # metas.modified is stale (2024) — never trust it
    records_count_at_validation: 1610006
    fields_observed: [id, location_id, sensing_date, hourday, direction_1,
                      direction_2, pedestriancount, sensor_name, location]
    notes: >
      Data observed through 2026-07-24 at validation (fresher than the
      doc's "monthly" claim). Observed zero is a real count of 0;
      absence of a row is an outage — never conflate. Join to
      pedestrian_sensor_locations via location_id and respect
      sensor-location validity periods.

  - id: pedestrian_sensor_locations
    remote_dataset_id: pedestrian-counting-system-sensor-locations
    title: Pedestrian Counting System — Sensor Locations
    capability: Sensor position, status, direction labels, install history
    fetch_mode: export
    export_format: json
    expected_cadence: daily_check
    primary_keys: [location_id]
    geometry: point
    licence: CC BY
    status: active
    freshness:
      strategy: metadata
    records_count_at_validation: 134
    fields_observed: [location_id, sensor_description, sensor_name,
                      installation_date, note, location_type, status,
                      direction_1, direction_2, latitude, longitude, location]
    notes: >
      Sensors move and are decommissioned; historical counts must join to
      the correct location period. status field distinguishes active
      sensors — required by the confidence model.

  - id: transport_activity
    remote_dataset_id: transport-activity-counts
    title: Transport Activity Counts
    capability: 5-minute multimodal activity (pedestrian/cyclist/escooter/
      vehicle classes) near monitored corridors — HISTORICAL archive
    fetch_mode: export        # nominal only while status is manual
    export_format: csv
    expected_cadence: manual  # operator-supplied archives; API feed dead
    primary_keys: [countLocationId, countlineName, from, class]
    geometry: point
    licence: CC BY
    status: manual
    freshness:
      strategy: max_field
      field: from
    records_count_at_validation: 0   # via API; bulk archives have data
    # Bulk-archive CSV header (the schema we actually load). Differs from
    # the API metadata field list: no countin/countout directional split,
    # different casing (countLocationId vs countlocationid), extra
    # year/quarter columns, no skip_record.
    fields_observed: [countLocationId, countlineName, countlineDirection,
                      CountLocationLat, CountLocationLong, "from", to,
                      class, count, year, quarter]
    notes: >
      API BLOCKED 2026-07-25 (total_count=0 via /records, /exports AND
      count(*)), but operator-downloaded yearly bulk archives
      (TransportActivityCount_2023..2026.zip, retrieved 2026-05-11,
      ~3.4 GB uncompressed CSV) cover 2023-01 through 2026-05-11 and are
      adopted into the raw layout via `cli adopt`. CAVEATS for the
      transform stage: (1) timestamps are UTC ("Z") — convert to
      Australia/Melbourne BEFORE deriving dates/dayparts or every peak
      lands on the wrong local day; (2) absence of a (location, interval,
      class) row is ambiguous missingness, never zero (architecture doc
      §4.2); (3) archive is frozen at 2026-05-11 — freshness/confidence
      must reflect that staleness and the "current activity" layer stays
      deferred until a live feed returns; (4) 14 observed classes incl.
      escooter, emergency_*, fire_engine — map via versioned config, not
      code. Re-check the API feed periodically; if it revives, flip
      status back to active and reconcile schema drift vs the archives.

