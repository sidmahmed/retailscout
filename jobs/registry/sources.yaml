      No stable natural key — (census_year, property_id, trading_name,
      industry_anzsic4_code) is not guaranteed unique; profile duplicates
      during staging before choosing a synthetic key. census_year 2024
      confirmed present. Multi-year history in one dataset: filter by
      census_year, keep all years for trend features.

