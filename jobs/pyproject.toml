[project]
name = "retailscout-jobs"
version = "0.1.0"
description = "RetailScout data worker: ingestion, transforms, features, scoring. Heavy deps live HERE, never in backend/."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

# Add these as the corresponding pipeline stages are built — declared
# here as documentation so nobody reaches for pandas out of habit:
#   transform/features:  "polars", "pyarrow", "pandera"
#   geospatial:          "geopandas", "shapely", "pyproj", "h3"
#   db loading:          "sqlalchemy>=2", "psycopg[binary]", "geoalchemy2"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["retailscout_jobs"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
