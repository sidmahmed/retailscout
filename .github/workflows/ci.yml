name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  jobs-worker:
    # Has a postgres service (unlike backend/) because the provenance,
    # transform, and grid tests write to source.*/core.*/analytics.* and
    # need migrations applied first (alembic upgrade head, below).
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: jobs } }
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: retailscout
          POSTGRES_USER: retailscout
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retailscout" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_DIRECT_URL: postgresql+psycopg://retailscout:ci-only@localhost:5432/retailscout
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: alembic upgrade head
        working-directory: db
        run: uv run --with alembic,sqlalchemy,"psycopg[binary]" alembic upgrade head
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  migrations:
    # Proves migrations apply cleanly against real PostGIS.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: retailscout
          POSTGRES_USER: retailscout
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U retailscout" --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: alembic upgrade head
        working-directory: db
        env:
          DATABASE_DIRECT_URL: postgresql+psycopg://retailscout:ci-only@localhost:5432/retailscout
        run: uv run --with alembic,sqlalchemy,"psycopg[binary]" alembic upgrade head
